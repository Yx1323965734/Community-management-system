{% extends "admin/layout.html" %}

{% block title %}{{ '修改' if record else '登记' }}维修记录 - 管理后台{% endblock %}

{% block content %}
<div class="page-title">
    <h2>{{ '修改' if record else '登记新' }}维修记录</h2>
</div>

<div class="pub-box" style="background: white; padding: 30px; border-radius: 8px; max-width: 800px;">
    <form action="{{ url_for('admin.maintenance_edit', record_id=record.id) if record else url_for('admin.maintenance_add') }}" method="post">
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">标题 (简述):</label>
            <input type="text" name="title" value="{{ record.title if record else '' }}" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">设施名称/地点:</label>
            <input type="text" name="facility" value="{{ record.facility if record else '' }}" placeholder="例如：3号楼电梯、地下车库" required
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="display:block; margin-bottom:8px; font-weight:bold;">记录类型:</label>
                <select name="record_type" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="repair" {% if record and record.record_type == 'repair' %}selected{% endif %}>故障维修</option>
                    <option value="schedule" {% if record and record.record_type == 'schedule' %}selected{% endif %}>定期保养</option>
                    <option value="inspection" {% if record and record.record_type == 'inspection' %}selected{% endif %}>安全巡检</option>
                </select>
            </div>
            <div>
                <label style="display:block; margin-bottom:8px; font-weight:bold;">当前状态:</label>
                <select name="status" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="scheduled" {% if record and record.status == 'scheduled' %}selected{% endif %}>计划中</option>
                    <option value="in-progress" {% if record and record.status == 'in-progress' %}selected{% endif %}>进行中</option>
                    <option value="completed" {% if record and record.status == 'completed' %}selected{% endif %}>已完成</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="display:block; margin-bottom:8px; font-weight:bold;">开始日期:</label>
                <input type="date" name="start_date" required
                       value="{{ record.start_date.strftime('%Y-%m-%d') if record else today }}"
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
            </div>
            <div>
                <label style="display:block; margin-bottom:8px; font-weight:bold;">负责人/公司:</label>
                <input type="text" name="responsible_person" value="{{ record.responsible_person if record else '' }}"
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">详细描述:</label>
            <textarea name="description" rows="5" 
                      style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">{{ record.description if record else '' }}</textarea>
        </div>

        <button type="submit" style="background: #1e5799; color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer;">
            {{ '保存修改' if record else '确认登记' }}
        </button>
        <a href="{{ url_for('admin.manage_maintenance') }}" style="margin-left: 10px; color: #666; text-decoration: none;">取消</a>
    </form>
</div>
{% endblock %}
